<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>WebGL Demo</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/2.8.1/gl-matrix-min.js"
    integrity="sha512-zhHQR0/H5SEBL3Wn6yYSaTTZej12z0hVZKOv3TwCUXT1z5qeqGcXJLLrbERYRScEDDpYIJhPC1fk31gqR783iQ=="
    crossorigin="anonymous" defer></script>
  <script src="webgl-demo.js" type="module"></script>
</head>

<body>
  <h1>Fun with Mazes</h1>
  <div>
    <canvas id="gl-canvas" width="640" height="480"></canvas>
  </div>
  <div>
    <label for="generators">Generation Algorithm:</label>
    <select name="generators" id="generators">
      <option value="binTree">Binary Tree</option>
      <option value="sidewinder">Sidewinder</option>
    </select>
    <label for="solvers">Solver Algorithm:</label>
    <select name="solvers" id="solvers">
      <option value="dijkstra">Dijkstra</option>
    </select>
  </div>
  <div>
    <button id="generate">Generate</button>
    <button id="solve">Solve</button>
  </div>
</body>

</html>
